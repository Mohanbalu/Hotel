<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Booking Confirmation</title>
    <style>
      body { font-family: Arial, sans-serif; background: #f7fafc; color: #0f1724; }
      .container { max-width: 600px; margin: 24px auto; background: #ffffff; padding: 24px; border-radius: 8px; }
      .details { background:#f1f5f9; padding:12px; border-radius:6px; }
      .cta { display:inline-block; padding:12px 18px; background:#0ea5a4; color:#fff; border-radius:6px; text-decoration:none; }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Booking Confirmed</h1>
      <p>Your booking <strong>%s</strong> has been confirmed.</p>
      <div class="details">
        <p><strong>Hotel:</strong> %s</p>
        <p><strong>Room:</strong> %s</p>
        <p><strong>Check-in:</strong> %s</p>
        <p><strong>Check-out:</strong> %s</p>
        <p><strong>Amount:</strong> %s</p>
      </div>
      <p>We look forward to hosting you. If you have any questions, reply to this email.</p>
      <p>Best regards,<br/>Hotel Booking Team</p>
    </div>
  </body>
</html>

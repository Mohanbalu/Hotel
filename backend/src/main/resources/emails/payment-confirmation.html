<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Payment Confirmation</title>
    <style>
      body { font-family: Arial, sans-serif; background: #f7fafc; color: #0f1724; }
      .container { max-width: 600px; margin: 24px auto; background: #ffffff; padding: 24px; border-radius: 8px; }
      .details { background:#f1f5f9; padding:12px; border-radius:6px; }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Payment Received</h1>
      <p>Payment <strong>%s</strong> was successful.</p>
      <div class="details">
        <p><strong>Amount:</strong> %s</p>
        <p><strong>Status:</strong> %s</p>
      </div>
      <p>Thank you for your payment. Reach out if you need assistance.</p>
      <p>Best regards,<br/>Hotel Booking Team</p>
    </div>
  </body>
</html>

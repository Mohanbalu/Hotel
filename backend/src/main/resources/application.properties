# Server
server.port=8080

# DataSource (MySQL)
spring.datasource.url=jdbc:mysql://localhost:3306/hotel_booking_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:2004}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# SQL logging
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE

# JWT
jwt.secret=${JWT_SECRET:REPLACE_WITH_BASE64_ENCODED_256_BIT_SECRET_KEY_FOR_PRODUCTION}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Security and authentication logs
logging.level.org.springframework.security=INFO
logging.level.com.hotelbooking.security=DEBUG

# Application logging
logging.level.com.hotelbooking=INFO
logging.file.name=logs/application.log